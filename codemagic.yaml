# =============================================================================
# Codemagic — quran_app (ترتيل) — بناء IPA بدون توقيع Apple
# =============================================================================
# Workspace: ios/Runner.xcworkspace
# Scheme:    Runner (مشترك في ios/Runner.xcodeproj/xcshareddata/xcschemes/)
#
# لا يُستخدم: App Store Connect، keychain signing، fetch-signing-files،
#             xcode-project use-profiles، flutter build ipa (يتطلب توقيعاً).
#
# الطريقة: flutter build ios --release --no-codesign ثم تجميع IPA من Runner.app
# (هيكل Payload/Runner.app كما يتوقع نظام تثبيت IPA). ملف ExportOptions.plist
# محفوظ للتوثيق وللاستخدام لاحقاً مع توقيع؛ لا يُستدعى في هذا الـ workflow.
# =============================================================================

workflows:
  ios-ipa-unsigned:
    name: iOS unsigned IPA — Runner (no Apple signing)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        # يطابق المشروع الفعلي (Runner.xcworkspace / scheme Runner)
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        IPA_NAME: quran_app_unsigned.ipa
    scripts:
      - name: التحقق من بنية المشروع وملفات iOS
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR}"
          test -f pubspec.yaml
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata
          test -f ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          test -f ios/Podfile
          echo "OK: pubspec + Runner.xcworkspace + scheme Runner + Podfile"

      - name: Flutter pub get (يولّد ios/Flutter/Generated.xcconfig والملحقات)
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR}"
          flutter --version
          flutter pub get

      - name: CocoaPods — pod install (يربط الإضافات ويحدّث workspace)
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR}/ios"
          pod install --repo-update

      - name: التحقق — scheme Runner داخل Workspace (يكشف أخطاء xcodebuild 64 مبكراً)
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR}"
          xcodebuild -list -workspace "${XCODE_WORKSPACE}"

      - name: بناء iOS Release بدون أكواد توقيع (لا يحتاج حساب Apple)
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR}"
          flutter build ios --release --no-codesign

      - name: تجميع IPA من Runner.app (unsigned — Payload + zip)
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR}"
          OUT_IPA="${IPA_NAME:-quran_app_unsigned.ipa}"
          RUNNER_APP=""
          for cand in \
            "build/ios/Release-iphoneos/Runner.app" \
            "build/ios/iphoneos/Runner.app"; do
            if [ -d "${cand}" ]; then RUNNER_APP="${cand}"; break; fi
          done
          if [ -z "${RUNNER_APP}" ]; then
            RUNNER_APP="$(find build/ios -type d -name "Runner.app" 2>/dev/null | grep -E 'iphoneos|Release-iphoneos' | head -n 1 || true)"
          fi
          if [ -z "${RUNNER_APP}" ]; then
            RUNNER_APP="$(find build/ios -type d -name "Runner.app" 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "${RUNNER_APP}" ] || [ ! -d "${RUNNER_APP}" ]; then
            echo "ERROR: لم يُعثر على Runner.app تحت build/ios"
            find build/ios -maxdepth 8 -type d 2>/dev/null || true
            exit 1
          fi
          echo "Using Runner.app at: ${RUNNER_APP}"
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa
          STAGING="$(mktemp -d)"
          mkdir -p "${STAGING}/Payload"
          cp -R "${RUNNER_APP}" "${STAGING}/Payload/"
          (cd "${STAGING}" && zip -qry "${CM_BUILD_DIR}/build/ios/ipa/${OUT_IPA}" Payload)
          rm -rf "${STAGING}"
          ls -la build/ios/ipa/
          echo "IPA ready: build/ios/ipa/${OUT_IPA}"

    artifacts:
      - build/ios/ipa/*.ipa

  # ---------------------------------------------------------------------------
  # محاكي iOS — Runner.app + zip لـ Appetize (لا IPA، لا ExportOptions، لا توقيع متجر)
  # ---------------------------------------------------------------------------
  ios-simulator-appetize:
    name: iOS Simulator .app + zip (Appetize)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        ZIP_NAME: Runner_simulator_appetize.zip
    scripts:
      - name: بناء محاكي + نسخ إلى build/ios/iphonesimulator + zip
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR}"
          chmod +x scripts/build_ios_simulator_appetize.sh
          export ZIP_NAME="${ZIP_NAME:-Runner_simulator_appetize.zip}"
          ./scripts/build_ios_simulator_appetize.sh
    artifacts:
      - build/ios/iphonesimulator/*.zip
